<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Pupil Tracker</title>
    <style>
      :root {
        --paper-50: #f3f6f4;
        --paper-500: #6f7c77;
        --paper-800: #2c3531;
        --brand-500: #4c9e8f;
        --surface: #ffffff;
      }
      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 16px;
        padding: 24px;
        box-sizing: border-box;
        background: var(--paper-50);
        color: var(--paper-800);
        font-family: system-ui, sans-serif;
        text-align: center;
      }
      h1 { font-size: 22px; margin: 0; }
      p { color: var(--paper-500); font-size: 14px; margin: 0; max-width: 300px; }
      button {
        border: 0;
        border-radius: 10px;
        padding: 12px 24px;
        font-size: 15px;
        font-weight: 700;
        background: var(--brand-500);
        color: var(--surface);
      }
    </style>
  </head>
  <body>
    <h1>Can't reach the tracker</h1>
    <p>Check the phone's internet connection, then try again.</p>
    <button onclick="location.href='https://pupils-tracker-r7zb.vercel.app/phone'">Try again</button>
  </body>
</html>
