# Builds the Pupil Tracker Android app (debug APK) — this PC has no Android
# SDK, so the APK is made here. Download it from the run's "Artifacts".
name: Android APK

on:
  workflow_dispatch:
  push:
    paths:
      - "pupils-tracker/android/**"
      - "pupils-tracker/capacitor.config.ts"
      - "pupils-tracker/capacitor-www/**"
      - "pupils-tracker/package.json"
      - ".github/workflows/android-apk.yml"

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: pupils-tracker
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: pupils-tracker/package-lock.json

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - run: npm ci

      - run: npx cap sync android

      - name: Build debug APK
        working-directory: pupils-tracker/android
        run: |
          # Committed from Windows: strip CRLF so the script runs on Linux.
          sed -i 's/\r$//' gradlew
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - uses: actions/upload-artifact@v5
        with:
          name: pupil-tracker-apk
          path: pupils-tracker/android/app/build/outputs/apk/debug/app-debug.apk
